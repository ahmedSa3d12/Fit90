<html lang="en" dir="ltr">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/fit90-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#B91C1C" />
    <title>FIT90 Gym</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('one80_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
          // FIT90 is English-first; only switch to Arabic/RTL when explicitly saved.
          var locale = localStorage.getItem('one80_locale');
          if (locale === 'ar') {
            document.documentElement.setAttribute('lang', 'ar');
            document.documentElement.setAttribute('dir', 'rtl');
          } else {
            document.documentElement.setAttribute('lang', 'en');
            document.documentElement.setAttribute('dir', 'ltr');
          }
        } catch (e) {}
      })();
    </script>
